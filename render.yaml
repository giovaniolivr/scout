services:
  - type: web
    name: scout
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn scout_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.6

databases:
  - name: scout-db
    databaseName: scout
    user: scout
    plan: free
